<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数学 計算ドリル</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#1d2421;--sub:#66706b;--line:#d9ded9;--acc:#1f6f5c;--accsoft:#e3f1ec;--err:#b3261e;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#141817;--card:#1d2321;--ink:#e8ede9;--sub:#98a39d;--line:#34403b;--acc:#58c2a4;--accsoft:#1f3a32;--err:#ff8a80}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;line-height:1.7;line-break:strict;overflow-wrap:break-word;word-break:normal;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.app{flex:1;width:100%;max-width:720px;margin:0 auto;padding:8px 6px 0}
.prog{display:flex;align-items:center;gap:10px;padding:0 4px 8px;font-size:.9rem;color:var(--sub)}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.err{color:var(--err);font-size:.82rem;white-space:pre-wrap;padding:6px 8px;border:1px solid var(--err);border-radius:8px;margin-bottom:6px}
.stage{display:grid;grid-template-columns:34px minmax(0,1fr) 34px;gap:4px;min-height:calc(100dvh - 110px)}
.nav{border:1px solid var(--line);background:var(--card);color:var(--acc);font-size:1.8rem;border-radius:10px;cursor:pointer;padding:0;touch-action:manipulation}
.nav:disabled{opacity:.25;cursor:default}
.nav:not(:disabled):active{background:var(--accsoft)}
.view{align-self:center;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 12px;min-width:0}
.tag{display:inline-block;font-size:.78rem;color:var(--acc);background:var(--accsoft);border-radius:6px;padding:1px 8px;margin:0 6px 6px 0}
.no{font-weight:700;font-size:1.05rem;margin:0 0 4px}
.q{margin:6px 0;font-size:1.02rem;line-height:1.9}
.q .katex{display:inline-block;white-space:nowrap;font-size:1.05em}
.m{overflow-x:auto;overflow-y:hidden;max-width:100%;-webkit-overflow-scrolling:touch}
.m .katex-display{margin:.5em 0}
.m .katex{font-size:1.15em}
.ans{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.ans b{color:var(--acc);font-size:.9rem}
.ex{font-size:.92rem;color:var(--sub);margin:2px 0 0}
.fin{text-align:center;padding:24px 12px}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;background:var(--acc);color:#fff;padding:12px 20px;cursor:pointer;touch-action:manipulation}
@media (prefers-color-scheme:dark){.btn{color:#0b1512}}
.btn.ghost{background:var(--card);color:var(--acc);border:1px solid var(--line)}
#answers .card{margin-bottom:10px}
.bk{text-align:center;margin:8px 0 12px}
.foot{display:flex;justify-content:flex-end;padding:2px 8px 4px}
.mini{font:inherit;font-size:.72rem;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:6px;padding:2px 8px;cursor:pointer}
.vh{position:absolute;width:1px;height:1px;margin:0;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:pre}
</style>
</head>
<body>
<main class="app">
  <div class="prog"><span id="pos"></span><div class="bar"><i id="fill"></i></div></div>
  <div id="err" class="err" hidden></div>
  <section id="quiz" class="stage">
    <button id="prev" class="nav" type="button" aria-label="前の問題">‹</button>
    <div id="view" class="view"></div>
    <button id="next" class="nav" type="button" aria-label="次の問題">›</button>
  </section>
  <section id="answers" hidden></section>
</main>
<footer class="foot"><button id="copy" class="mini" type="button">問題をコピー</button></footer>
<pre id="plain" class="vh"></pre>

<!-- ===== 問題データ：編集はこのブロックの中だけ（書式は README.md）=====
     問題は --- で区切る。各行は「キー: 値」。LaTeXはそのまま書く（エスケープ不要）。
     キー  科目 / 単元 / 問題 / 式(任意) / 答 / 解説(任意) / 難度(任意 1〜3)
     注意  文中に script の閉じタグを書かない -->
<script id="problems" type="text/plain">
科目: 数学IA
単元: 絶対値不等式
難度: 1
問題: 次の不等式を解け。
式: |2x-3|\leq 5
答: -1\leq x\leq 4
解説: $-5\leq 2x-3\leq 5$ より。
---
科目: 数学IA
単元: たすき掛け
難度: 2
問題: 次の式を因数分解せよ。
式: 6x^2+x-2
答: (2x-1)(3x+2)
解説: $6=2\times3,\ -2=-1\times2$ の組合せで中央の項が $x$ になる。
---
科目: 数学IA
単元: 2次関数の最大・最小
難度: 2
問題: $0\leq x\leq 3$ における次の関数の最大値と最小値を求めよ。
式: y=-x^2+4x+1
答: \begin{gathered}\max=5\ (x=2)\\ \min=1\ (x=0)\end{gathered}
解説: $y=-(x-2)^2+5$。端点は $x=0$ で $1$、$x=3$ で $4$。
---
科目: 数学IA
単元: 正弦定理
難度: 1
問題: △ABC で $a=6,\ A=30^\circ,\ B=45^\circ$ のとき、辺 $b$ の長さを求めよ。
答: b=6\sqrt{2}
解説: $b=\dfrac{a\sin B}{\sin A}=6\cdot\dfrac{\sqrt2}{2}\cdot2$。
---
科目: 数学IA
単元: ヘロンの公式
難度: 2
問題: 3辺が $5,\ 6,\ 7$ の三角形の面積を求めよ。
答: 6\sqrt{6}
解説: $s=9$、面積 $=\sqrt{9\cdot4\cdot3\cdot2}=\sqrt{216}$。
---
科目: 数学IA
単元: 場合の数（余事象）
難度: 1
問題: 男子3人、女子4人から3人を選ぶとき、女子が少なくとも1人含まれる選び方は何通りか。
答: 34
解説: 全体 ${}_7\mathrm{C}_3=35$ から男子のみの $1$ 通りを引く。
---
科目: 数学IA
単元: 確率
難度: 1
問題: 赤玉3個、白玉2個が入った袋から同時に2個取り出すとき、2個が同じ色である確率を求めよ。
答: \dfrac{2}{5}
解説: $\dfrac{{}_3\mathrm{C}_2+{}_2\mathrm{C}_2}{{}_5\mathrm{C}_2}=\dfrac{4}{10}$。
---
科目: 数学IA
単元: 整数（最大公約数・最小公倍数）
難度: 1
問題: $168$ と $120$ の最大公約数と最小公倍数を求めよ。
答: \begin{gathered}\gcd=24\\ \operatorname{lcm}=840\end{gathered}
解説: $168=2^3\cdot3\cdot7,\ 120=2^3\cdot3\cdot5$。
---
科目: 数学IA
単元: 集合の要素の個数
難度: 2
問題: 100以下の自然数のうち、3の倍数または5の倍数であるものは何個か。
答: 47
解説: $33+20-6$（15の倍数が $6$ 個）。
---
科目: 数学IA
単元: データの分析
難度: 1
問題: データ $2,\ 4,\ 5,\ 7,\ 8,\ 10,\ 13$ の四分位範囲を求めよ。
答: 6
解説: $Q_1=4,\ Q_3=10$（中央値 $7$ は除いて分ける）。
---
科目: 数学IIB
単元: 二項定理
難度: 2
問題: $(2x-1)^5$ の展開式における $x^3$ の係数を求めよ。
答: 80
解説: ${}_5\mathrm{C}_3\cdot2^3\cdot(-1)^2=10\cdot8$。
---
科目: 数学IIB
単元: 因数定理
難度: 1
問題: $x^3+ax^2+x-6$ が $x-2$ で割り切れるように、定数 $a$ の値を定めよ。
答: a=-1
解説: $f(2)=8+4a+2-6=0$ より。
---
科目: 数学IIB
単元: 相加平均・相乗平均
難度: 2
問題: $x>0$ のとき、次の式の最小値を求めよ。
式: x+\dfrac{9}{x}
答: 6
解説: $x+\frac9x\geq2\sqrt9$、等号は $x=3$。
---
科目: 数学IIB
単元: 円と直線
難度: 2
問題: 直線 $y=x+k$ が円 $x^2+y^2=2$ に接するとき、定数 $k$ の値を求めよ。
答: k=\pm 2
解説: 中心と直線の距離 $\dfrac{|k|}{\sqrt2}$ が半径 $\sqrt2$ に等しい。
---
科目: 数学IIB
単元: 指数方程式
難度: 2
問題: 次の方程式を解け。
式: 4^x-5\cdot2^x+4=0
答: x=0,\ 2
解説: $2^x=t>0$ とおくと $t^2-5t+4=0$。
---
科目: 数学IIB
単元: 三角関数の合成
難度: 2
問題: $0\leq\theta<2\pi$ のとき、次の式の最大値と、そのときの $\theta$ を求めよ。
式: \sin\theta+\sqrt{3}\cos\theta
答: \max=2\ \left(\theta=\dfrac{\pi}{6}\right)
解説: $2\sin\left(\theta+\frac{\pi}{3}\right)$ と合成できる。
---
科目: 数学IIB
単元: 微分（極値）
難度: 2
問題: 関数 $f(x)=x^3-6x^2+9x$ の極大値を求めよ。
答: 4
解説: $f'(x)=3(x-1)(x-3)$、$x=1$ で極大。
---
科目: 数学IIB
単元: 積分（面積）
難度: 2
問題: 放物線 $y=x^2$ と直線 $y=x$ で囲まれた部分の面積を求めよ。
答: \dfrac{1}{6}
解説: $\displaystyle\int_0^1(x-x^2)\,dx$。
---
科目: 数学IIB
単元: 階差数列
難度: 2
問題: 数列 $1,\ 2,\ 5,\ 10,\ 17,\ \dots$ の一般項 $a_n$ を求めよ。
答: a_n=n^2-2n+2
解説: 階差が $1,3,5,7,\dots$ なので $a_n=1+(n-1)^2$。
---
科目: 数学IIB
単元: ベクトルのなす角
難度: 2
問題: $\vec{a}=(1,\ \sqrt{3}),\ \vec{b}=(2,\ 0)$ のなす角 $\theta\ (0^\circ\leq\theta\leq180^\circ)$ を求めよ。
答: \theta=60^\circ
解説: $\cos\theta=\dfrac{\vec a\cdot\vec b}{|\vec a||\vec b|}=\dfrac{2}{2\cdot2}$。
</script>

<script>
/* ===== UIロジック（触らない）===== */
const $ = id => document.getElementById(id);
const KEY = {'科目':'c','単元':'t','問題':'q','式':'m','答え':'a','答':'a','難度':'lv','解説':'e'};
const NAME = {c:'科目',t:'単元',q:'問題',a:'答'};
function parse(txt){
  const out = [], errs = []; let cur = null;
  txt.split('\n').forEach((ln, k) => {
    const s = ln.trim();
    if(!s || s[0] === '#') return;
    if(/^-{3,}$/.test(s)){ cur = null; return; }
    const mt = s.match(/^(科目|単元|問題|式|答え|答|難度|解説)\s*[:：]\s*(.*)$/);
    if(!mt){ errs.push('データ' + (k+1) + '行目: 書式エラー「' + s.slice(0,24) + '」'); return; }
    if(!cur){ cur = {}; out.push(cur); }
    const key = KEY[mt[1]];
    if(cur[key] !== undefined) errs.push('データ' + (k+1) + '行目: 「' + mt[1] + '」が重複（問題の間に --- が必要）');
    cur[key] = mt[2].trim();
  });
  const ok = [];
  out.forEach((p, n) => {
    const miss = Object.keys(NAME).filter(x => !p[x]).map(x => NAME[x]);
    if(miss.length) errs.push((n+1) + '番目の問題: ' + miss.join('・') + 'がありません（この問題は除外）'); else ok.push(p);
  });
  return {list: ok, errs};
}
const parsed = parse($('problems').textContent);
const PROBLEMS = parsed.list, N = PROBLEMS.length;
let i = 0, shown = false;

function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
function math(src){ const d = el('div','m',src); d.dataset.tex = src; return d; }
function typeset(root){
  if(!window.katex) return;
  root.querySelectorAll('[data-tex]').forEach(e => katex.render(e.dataset.tex, e, {displayMode:true, throwOnError:false}));
  if(window.renderMathInElement) root.querySelectorAll('.q,.ex').forEach(e => renderMathInElement(e, {delimiters:[{left:'$',right:'$',display:false}], throwOnError:false}));
}
function card(p, n, withAns){
  const c = el('article','card');
  c.append(el('span','tag',p.c), el('span','tag',p.t));
  const lv = parseInt(p.lv, 10); if(lv >= 1 && lv <= 3) c.append(el('span','tag','★'.repeat(lv)));
  c.append(el('p','no','第' + (n+1) + '問'), el('p','q',p.q));
  if(p.m) c.append(math(p.m));
  if(withAns){
    const a = el('div','ans'); a.append(el('b',null,'解答'), math(p.a));
    if(p.e) a.append(el('p','ex',p.e));
    c.append(a);
  }
  return c;
}
function plain(withAns){
  const L = ['# 数学 計算問題 全' + N + '問（$...$ はLaTeX数式）'];
  PROBLEMS.forEach((p, n) => {
    L.push('', 'Q' + (n+1) + ' [' + p.c + ' / ' + p.t + ']', p.q);
    if(p.m) L.push('式: $' + p.m + '$');
    if(withAns){ L.push('答: $' + p.a + '$'); if(p.e) L.push('解説: ' + p.e); }
  });
  return L.join('\n');
}
function syncPlain(){ $('plain').textContent = plain(shown); $('copy').textContent = shown ? '問題と解答をコピー' : '問題をコピー'; }

function show(){
  const v = $('view'); v.replaceChildren();
  if(N === 0){ v.append(el('div','card fin','表示できる問題がありません。')); }
  else if(i < N){ v.append(card(PROBLEMS[i], i, false)); }
  else {
    const f = el('div','card fin'); f.append(el('p','q','全' + N + '問おわりました。'));
    const b = el('button','btn','解答を表示'); b.type = 'button'; b.onclick = showAnswers; f.append(b); v.append(f);
  }
  $('prev').disabled = i === 0; $('next').disabled = i >= N;
  $('pos').textContent = N === 0 ? '' : (i < N ? (i+1) + ' / ' + N : '終了');
  $('fill').style.width = N ? (Math.min(i+1, N) / N * 100) + '%' : '0';
  typeset(v);
}
function backBtn(){ const w = el('div','bk'); const b = el('button','btn ghost','最初に戻る'); b.type = 'button'; b.onclick = restart; w.append(b); return w; }
function showAnswers(){
  shown = true; syncPlain();
  const s = $('answers'); s.replaceChildren(backBtn());
  PROBLEMS.forEach((p, n) => s.append(card(p, n, true)));
  s.append(backBtn());
  $('quiz').hidden = true; s.hidden = false; typeset(s); window.scrollTo(0,0);
}
function restart(){ shown = false; syncPlain(); i = 0; $('answers').hidden = true; $('quiz').hidden = false; show(); window.scrollTo(0,0); }

async function copyText(t){
  try{ await navigator.clipboard.writeText(t); }
  catch(e){ const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0'; document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
}
function showErr(lines){ const b = $('err'); b.textContent = lines.join('\n'); b.hidden = !lines.length; }
window.addEventListener('error', e => showErr([...(parsed.errs), '実行エラー: ' + e.message]));

document.addEventListener('DOMContentLoaded', () => {
  showErr(parsed.errs);
  $('prev').onclick = () => { if(i > 0){ i--; show(); } };
  $('next').onclick = () => { if(i < N){ i++; show(); } };
  $('copy').onclick = async () => {
    const b = $('copy'), old = b.textContent; await copyText(plain(shown)); b.textContent = 'コピーしました';
    setTimeout(() => { b.textContent = old; }, 1500);
  };
  document.addEventListener('keydown', e => {
    if($('quiz').hidden) return;
    if(e.key === 'ArrowRight') $('next').click(); else if(e.key === 'ArrowLeft') $('prev').click();
  });
  syncPlain(); show();
});
</script>
</body>
</html>
